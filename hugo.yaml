              Leads a 5-person AI team across Computer Vision and AI Agents.

              - Technical oversight of production computer vision systems with 30+ deep learning models (CNNs and Vision Transformers).
              - Strategic technical decisions in computer vision and MLOps; planning and stakeholder meetings.
              - Introduced tooling standards (uv, ruff, MLflow) that improved consistency.
              - Resolved critical AI–IT communication breakdowns (cuDNN / ONNX / TensorRT) that had been blocking deployments for months.
              - Code/PR reviews and ongoing hands-on technical work (training, validation, architecture optimisation).

