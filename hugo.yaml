      - title: "Arachne"
        status: "in progress"
        content: "A text-to-SQL agent on LangGraph: plain-English question in, verified SQL out, executed against SQLite. The LLM is the small part; the engineering is the control flow around it — a SELECT-only guard, a bounded repair loop, execution-accuracy evals on the Spider dev set, LangSmith for observability. Early days: the graph skeleton compiles, the full loop is designed but not built. I'd rather show it honest than shiny."
