          - label: "focus"
            pre: "investigación "
            accent: "→"
            post: " producción"
            sub: "donde los modelos llegan a producción"

      # About
      about:
        enable: true
        title: "Sobre Mí"
        content: |-
          Soy Marcos. Entré en VRAIA en 2020 como el junior que automatizaba el trabajo de etiquetado; seis años después dirijo el equipo de IA. La misma empresa, un trabajo muy distinto — y sin soltar el código en todo el camino.

          Casi todo lo que sé viene de mantener más de 30 CNNs y Vision Transformers vivos en producción industrial. No la demo: los años de después. Drift, el infierno de dependencias (cuDNN, ONNX, TensorRT) y despliegues parados durante meses porque dos equipos dejaron de hablarse.

          Esa última parte resultó ser el trabajo de verdad. Lo que mata un proyecto de IA casi nunca es el modelo; es la comunicación. Hoy paso la mayor parte del tiempo en esa frontera: lo bastante técnico para que el equipo se fíe de mis reviews, lo bastante cerca de dirección para que los bloqueos se quiten de verdad.

          En mi tiempo libre construyo agentes con LangChain y LangGraph, porque los próximos años apuntan ahí. Inglés C1 de Cambridge; lo uso a diario.
        skills:
          enable: true
          title: "Tecnologías con las que trabajo:"
          skillGroups:
            - name: "ML & Deep Learning"
              items:
                - "Python"
                - "TensorFlow"
                - "Keras"
                - "PyTorch"
                - "OpenCV"
                - "NumPy"
                - "pandas"
                - "scikit-learn"
                - "ONNX"
                - "ONNXRuntime"
            - name: "MLOps & Herramientas"
              items:
                - "MLflow"
                - "uv"
                - "ruff"
                - "Git"
                - "Gitea"
                - "WSL"
                - "Ubuntu"
            - name: "Infraestructura & Datos"
              items:
                - "CUDA"
                - "cuDNN"
                - "PostgreSQL"
                - "Ceph"
                - "Docker"
            - name: "Agentes de IA"
              items:
                - "LangChain"
                - "LangGraph"

      # Experience
      experience:
        enable: true
        items:
          - company: "VRAIA"
            companyUrl: "https://vraia.com/"
            range: "2020 — presente"
            jobs:
              - name: "AI Tech Lead"
                date: "oct. 2024 - actualidad"
                info:
                  content: 5 personas, visión + agentes, sin soltar el código
                content: |
                  Dirijo el equipo de IA: 2 etiquetadores, un ingeniero junior y uno senior de IA, y un desarrollador de agentes, repartidos entre visión por computador y agentes. La app de agentes/RPA implica además coordinación constante con IT.

                  - Responsable técnico de los sistemas de visión en producción: más de 30 CNNs y Vision Transformers en distintos proyectos.
                  - Convertí uv, ruff y MLflow en el estándar del equipo. Menos fricción, menos "en mi máquina funciona".
                  - Desatasqué despliegues que llevaban meses parados por desajustes de versiones (cuDNN, ONNX, TensorRT) entre IA e IT.
                  - Reporto hacia arriba, protejo al equipo y quito bloqueos.
                  - Sigo con las manos en el código: entrenamiento, validación, decisiones de arquitectura y la cola de PRs.

              - name: "ML Engineer"
                date: "may. 2022 - oct. 2024"
                info:
                  content: Toda la visión artificial, dos líneas en paralelo
                content: |
                  Tras una reestructuración heredé todos los proyectos de visión que teníamos: segmentación y clasificación, corriendo en paralelo.

                  - El ciclo completo en mi mesa: entrenamiento, experimentos (MLflow), exportación a ONNX y despliegue con TensorRT junto a IT.
                  - Refactoricé una base de código legacy de clasificación que nadie quería tocar.
                  - Incorporé y mentoricé a un fichaje sin experiencia profesional previa programando.
                  - Enseñé a los etiquetadores suficiente Python y SQL para que escribieran sus scripts y lanzaran sus propias queries.

              - name: "Junior ML Engineer"
                date: "may. 2020 - may. 2022"
                info:
                  content: Aprendiendo IA en producción por las malas
                content: |
                  Llegué en mitad de un despliegue crítico, antes incluso de tener acceso al repo. Así que me puse a construir herramientas en Python para automatizar el etiquetado y un prototipo para gestionar splits del dataset — el prototipo acabó siendo la base de una herramienta interna.

                  - Con acceso al repo, pasé al fine-tuning de modelos y la experimentación con TensorFlow.
                  - Primeros despliegues en producción (formato .pb, codo con codo con IT).

          - company: "CFZ Cobots"
            companyUrl: "https://cfzcobots.com/"
            range: "2019"
            jobs:
              - name: "Computer Vision Engineering Intern"
                date: "mar. 2019 - may. 2019"
                info:
                  content: Prácticas universitarias
                content: |
                  Primer contacto con la visión por computador industrial: pruebas de software con cámaras Omron FH Series y cámaras de profundidad Intel RealSense, en Python.

      # Education
      education:
        enable: true
        index: false
        items:
          - title: "Grado en Ingeniería Robótica"
            school:
              name: "Universidad de Alicante"
              url: "https://www.ua.es"
            date: "2015 - 2019"
            content: |-
              Trabajo Fin de Grado: Asistente visual con IA para peatones ciegos en cruces.

              - Dataset propio de 1.010 imágenes etiquetadas (semáforo verde, semáforo rojo, paso de peatones) capturadas en varias ciudades españolas, de día y de noche.
              - Entrenamiento de YOLOv3 sobre Darknet con GPU Nvidia Quadro P6000, alcanzando un 92% de recall y 75% IoU en el conjunto de test.
              - Servidor Flask en Python para servir el modelo como API.
              - App Android en Java que consumía las predicciones y alertaba al usuario mediante vibración y sonido.
            badges:
              - "YOLOv3"
              - "Flask"
              - "Android"
              - "Python"
              - "Darknet"
              - "Java"
              - "C"
            featuredLink:
              enable: true
              name: "Ver proyecto"
              url: "https://drive.google.com/file/d/15BD01p0qNRsKOUDs_OwEkzabREqlK3QD/view"

      # Achievements
      achievements:
        enable: true
        items:
          - title: "De junior a Tech Lead, misma empresa"
            meta: "VRAIA · 2020 — actualidad"
            content: Entré en 2020 de junior. Seis años, dos ascensos y más de 30 modelos en producción después, dirijo el equipo. Cada paso, ganado en producción.
            image: /images/achievements/tree.png
          - title: "C1 Advanced (CAE)"
            meta: "Cambridge · 2021"
            content: "B2 en 2020, C1 en 2021 — ambos compaginados con jornada completa. Lo mantengo vivo con clases de conversación semanales. Verificación: B5924584."
            image: /images/achievements/cambridge.jpg
          - title: "Deep Learning Specialization"
            meta: "DeepLearning.AI · Andrew Ng · 2021"
            content: Especialización de 5 cursos que cubre CNNs, RNNs, LSTMs, Transformers, ajuste de hiperparámetros y optimización.
            image: /images/achievements/dl-specialization-coursera.jpg
            url: https://www.coursera.org/account/accomplishments/specialization/PCX3PLHHZVJX
          - title: "GANs Specialization"
            meta: "DeepLearning.AI · 2022"
            content: Especialización de 3 cursos que cubre arquitectura GAN, estrategias de entrenamiento, generación de imágenes y traducción imagen a imagen.
            image: /images/achievements/gans-coursera.jpg
            url: https://www.coursera.org/account/accomplishments/specialization/N859T5ZGN2S3
          - title: "LangChain Essentials"
            meta: "LangChain Academy · 2026"
            content: Curso oficial de LangChain que cubre conceptos clave e implementación en Python.
            image: /images/achievements/lgchain-academy.jpg
            url: https://academy.langchain.com/certificates/esvdpux1vk
          - title: "LangGraph Essentials"
            meta: "LangChain Academy · 2026"
            content: Curso oficial de LangGraph que cubre flujos de trabajo de agentes con estado en Python.
            image: /images/achievements/lgraph-academy.jpg
            url: https://academy.langchain.com/certificates/kebjr2g0jk

      # Projects
      projects:
        enable: true
        items:
          - title: "Este portfolio"
            status: "live"
            statusLive: true
            content: "El sitio en el que estás. Un sitio Hugo sin dependencia de theme: aplané el theme original (un submódulo de git) en mis propios layouts y construí un sistema de diseño documentado —el motivo de «detección»— mantenido como una skill de Claude Code. Se despliega solo en GitHub Pages mediante un pipeline de GitHub Actions."
            badges:
              - "Hugo"
              - "GitHub Actions"
              - "GitHub Pages"
              - "Claude Code"
              - "Agent Skills"
            links:
              - label: "Ver repo"
                url: "https://github.com/marcosmoreno-ai/marcosmoreno-ai.github.io"
              - label: "Ver sitio"
                url: "https://marcosmoreno-ai.github.io/"
          - title: "Arachne"
            status: "in progress"
            content: "Un agente text-to-SQL sobre LangGraph: entra una pregunta en lenguaje natural, sale SQL verificado y ejecutado contra SQLite. El LLM es la parte pequeña; la ingeniería está en el control flow de alrededor — guard SELECT-only, repair loop acotado, evals de execution accuracy sobre el dev set de Spider y LangSmith para observabilidad. Fase temprana: el esqueleto del grafo compila; el loop completo está diseñado, no terminado. Prefiero enseñarlo honesto antes que brillante."
            badges:
              - "LangGraph"
              - "LangChain"
              - "LangSmith"
              - "OpenAI"
              - "Pydantic"
              - "SQLite"
              - "uv"

      # Contact
      contact:
        enable: true
        heading: "Construyamos algo que llegue a producción"
        content: ¿Contratando? ¿Curiosidad por algo de lo que has visto? ¿Ganas de intercambiar batallitas de modelos en producción? Escríbeme — contesto.
        btnName: Escríbeme
        btnLink: mailto:marcosmoreno.of@gmail.com

