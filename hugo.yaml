            - "LangGraph"

  # Experience
  experience:
    enable: true
    items:
      - company: "VRAIA"
        companyUrl: "https://vraia.com/"
        range: "2020 — present"
        jobs:
          - name: "AI Tech Lead"
            date: "Oct 2024 - Present"
            info:
              content: 5 people, vision + agents, still hands-on
            content: |
              I run the AI team: 2 labelers, a junior and a senior AI engineer, and an agents developer, split across computer vision and AI agents. The agents/RPA app also means constant cross-team work with IT.

              - Own the technical side of our production vision systems: 30+ CNNs and Vision Transformers across different projects.
              - Made uv, ruff and MLflow the team standard. Less friction, fewer "works on my machine" conversations.
              - Unblocked deployments that had been stuck for months on version mismatches (cuDNN, ONNX, TensorRT) between AI and IT.
              - Report up, shield the team, remove blockers.
              - Still hands-on: training, validation, architecture decisions and the PR queue.

          - name: "ML Engineer"
            date: "May 2022 - Oct 2024"
            info:
              content: All of computer vision, two workstreams in parallel
            content: |
              After a restructure I inherited every computer vision project we had: segmentation and classification, running in parallel.

              - The full cycle on my desk: training, experiments (MLflow), ONNX export, TensorRT deployment alongside IT.
              - Refactored a legacy classification codebase nobody wanted to touch.
              - Onboarded and mentored a new hire with zero professional coding experience.
              - Taught our labelers enough Python and SQL to write their own scripts and run their own queries.

          - name: "Junior ML Engineer"
            date: "May 2020 - May 2022"
            info:
              content: Learning production AI the hard way
            content: |
              Joined in the middle of a critical deployment, before I even had repo access. So I built Python tools to automate the labeling grind and a prototype for managing dataset splits — the prototype later grew into an internal tool.

              - Once inside the repo, moved on to model fine-tuning and experimentation with TensorFlow.
              - First production deployments (.pb format, working side by side with IT).

      - company: "CFZ Cobots"
        companyUrl: "https://cfzcobots.com/"
        range: "2019"
        jobs:
          - name: "Computer Vision Engineering Intern"
            date: "Mar 2019 - May 2019"
            info:
              content: University internship
            content: |
              First contact with industrial computer vision: software testing with Omron FH Series industrial cameras and Intel RealSense depth cameras, in Python.

