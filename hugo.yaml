    params:
      # Hero
      hero:
        enable: true
        intro: "Hola, soy"
        title: "Marcos Moreno Martínez"
        subtitle: "AI Engineering Leader"
        content: "Ingeniero de ML con 6 años de experiencia en casos reales de producción, actualmente liderando dos equipos de IA. Especializado en Computer Vision, Deep Learning y en el liderazgo y la comunicación necesarios para que los proyectos lleguen a buen puerto."
        image: /images/ai-cv-image-2.jpg
        bottomImage:
          enable: true
        button:
          enable: false
          name: "Currículum"
          url: "#"
          download: true
          newPage: false
        socialLinks:
          fontAwesomeIcons:
            - icon: fab fa-linkedin
              url: https://www.linkedin.com/in/marcos-moreno-mart%C3%ADnez/
            - icon: fab fa-github
              url: https://github.com/marcosmoreno-ai

      # About
      about:
        enable: true
        title: "Sobre Mí"
        content: |-
          Soy Marcos, AI Engineering Leader con sede en España.

          En los últimos 6 años en VRAIA he pasado de construir pipelines de datos a liderar equipos de Machine Learning e IA con más de 30 modelos de deep learning (CNNs y Vision Transformers) en producción. Más recientemente asumí la supervisión de un proyecto de AI Agents y RPA para ayudar a que saliera adelante.

          Lo que he aprendido es que lo más difícil de la IA en producción no son los modelos — son las personas, la comunicación y los procesos. Llevo años moviéndome en esa frontera: con la solidez técnica para ganarme la confianza de mi equipo, y la visión organizativa para mantener las cosas en marcha cuando empiezan a atascarse.

          Actualmente profundizando en AI Agents — construyendo con LangChain y LangGraph en mis proyectos personales.

          C1 de inglés. Lidero con claridad. Hago crecer a las personas a mi alrededor.
        skills:
          enable: true
          title: "Tecnologías con las que trabajo:"
          skillGroups:
            - name: "ML & Deep Learning"
              items:
                - "Python"
                - "TensorFlow"
                - "Keras"
                - "PyTorch"
                - "OpenCV"
                - "NumPy"
                - "pandas"
                - "scikit-learn"
                - "ONNX"
                - "ONNXRuntime"
            - name: "MLOps & Herramientas"
              items:
                - "MLflow"
                - "uv"
                - "ruff"
                - "Git"
                - "Gitea"
                - "WSL"
                - "Ubuntu"
            - name: "Infraestructura & Datos"
              items:
                - "CUDA"
                - "cuDNN"
                - "PostgreSQL"
                - "Ceph"
                - "Docker"
            - name: "Agentes de IA"
              items:
                - "LangChain"
                - "LangGraph"

      # Experience
      experience:
        enable: true
        items:
          - company: "VRAiA"
            companyUrl: "https://vraia.com/"
            jobs:
              - name: "AI Tech Lead"
                date: "oct. 2024 - actualidad · Elche, España · Híbrido"
                info:
                  content: Lidera un equipo de IA de 5 personas
                content: |
                  Lidera un equipo de IA de 5 personas entre Computer Vision y AI Agents.

                  - Supervisión técnica de sistemas de visión en producción con más de 30 modelos de deep learning (CNNs y Vision Transformers).
                  - Decisiones técnicas estratégicas en visión por computador y MLOps; planificación y reuniones con stakeholders.
                  - Introduje estándares de tooling (uv, ruff, MLflow) que mejoraron la consistencia.
                  - Resolví bloqueos críticos entre IA e IT (cuDNN / ONNX / TensorRT) que llevaban meses frenando despliegues.
                  - Revisión de código/PRs y trabajo técnico continuo (entrenamiento, validación, optimización de arquitecturas).

              - name: "Deep Learning & Computer Vision Engineer"
                date: "may. 2022 - oct. 2024 · Elche, España · Híbrido"
                info:
                  content: Responsabilidad total de los proyectos de visión artificial
                content: |
                  Asumió la propiedad completa de los proyectos de visión tras una reestructuración.

                  - Fine-tuning de arquitecturas como U-Net y clasificadores basados en CNN.
                  - MLflow para seguimiento de experimentos; selección y validación de modelos.
                  - Optimización con ONNX y mixed-precision training en TensorFlow; coordinación con IT para despliegue con TensorRT.

              - name: "Junior Deep Learning & Computer Vision Engineer"
                date: "may. 2020 - may. 2022 · Aspe, España · Presencial"
                info:
                  content: Primeros pasos en IA en producción
                content: |
                  Primera experiencia en IA en producción; antes de tener acceso al repo construyó tooling en Python para automatizar etiquetado y un prototipo de gestión de splits.

                  - Fine-tuning y experimentación con TensorFlow.
                  - Primeros pipelines de despliegue en producción (.pb, integración con IT).

          - company: "CFZ Cobots"
            companyUrl: "https://cfzcobots.com/"
            jobs:
              - name: "Computer Vision Engineering Intern"
                date: "mar. 2019 - may. 2019 · Elche, España · Presencial"
                info:
                  content: Prácticas universitarias
                content: |
                  Prácticas universitarias; primer contacto con visión por computador industrial.

                  - Pruebas de software con cámaras industriales Omron FH Series y cámaras de profundidad Intel RealSense en Python.

      # Education
      education:
        enable: true
        index: false
        items:
          - title: "Grado en Ingeniería Robótica"
            school:
              name: "Universidad de Alicante"
              url: "https://www.ua.es"
            date: "2015 - 2019"
            content: ""
            featuredLink:
              enable: false

      # Achievements
      achievements:
        enable: true
        items:
          - title: 6 Años Creciendo en IA en Producción
            content: De Junior ML Engineer a AI Tech Lead en la misma empresa. Desde construir pipelines de datos hasta liderar un equipo de IA en producción.
            image: /images/achievements/tree.png
          - title: C1 Advanced (CAE) — Cambridge, 2021
            content: "B2 en 2020 y C1 en 2021, ambos compaginándolo con trabajo a jornada completa — entre estudio autodidacta, academia y examen oficial. Mantenido activamente con clases de conversación semanales."
            image: /images/achievements/cambridge.jpg
          - title: Deep Learning Specialization — DeepLearning.AI · 2021
            content: Especialización de 5 cursos que cubre CNNs, RNNs, LSTMs, Transformers, ajuste de hiperparámetros y optimización.
            image: /images/achievements/dl-specialization-coursera.jpg
            url: https://www.coursera.org/account/accomplishments/specialization/PCX3PLHHZVJX
          - title: GANs Specialization — DeepLearning.AI · 2022
            content: Especialización de 3 cursos que cubre arquitectura GAN, estrategias de entrenamiento, generación de imágenes y traducción imagen a imagen.
            image: /images/achievements/gans-coursera.jpg
            url: https://www.coursera.org/account/accomplishments/specialization/N859T5ZGN2S3
          - title: LangChain Essentials — LangChain Academy · 2026
            content: Curso oficial de LangChain que cubre conceptos clave e implementación en Python.
            image: /images/achievements/lgchain-academy.jpg
            url: https://academy.langchain.com/certificates/esvdpux1vk
          - title: LangGraph Essentials — LangChain Academy · 2026
            content: Curso oficial de LangGraph que cubre flujos de trabajo de agentes con estado en Python.
            image: /images/achievements/lgraph-academy.jpg
            url: https://academy.langchain.com/certificates/kebjr2g0jk

      # Projects
      projects:
        enable: true
        items:
          - title: lgagent
            content: Agente LangGraph que procesa pedidos de clientes recibidos por email, gestiona peticiones ambiguas y el ciclo de vida del pedido con confirmación human-in-the-loop.
            image: /images/projects/profile2.jpg
            badges:
              - "LangGraph"
              - "Python"
            links:
              - icon: fab fa-github
                url: https://github.com/marcosmoreno-ai/lgagent
          - title: mm-pyboiler
            content: Plantilla de proyecto Python (pyproject.toml, pre-commit hooks) con convenciones listas para producción.
            image: /images/projects/profile.png
            badges:
              - "Python"
              - "Docker"
            links:
              - icon: fab fa-github
                url: https://github.com/marcosmoreno-ai/mm-pyboiler

      # Contact
      contact:
        enable: true
        content: Mi bandeja de entrada siempre está abierta. Ya sea que tengas una pregunta o simplemente quieras saludar, ¡haré todo lo posible por responderte!
        btnName: Escríbeme
        btnLink: mailto:marcosmoreno.of@gmail.com

