      # Metrics readout band (Phase 4a)
      metrics:
        enable: true
        items:
          - label: "role"
            pre: "AI Tech "
            accent: "Lead"
            post: ""
            sub: "@ VRAIA · desde 2024"
          - label: "team"
            pre: "5 personas"
            accent: ""
            post: ""
            sub: "computer vision + ai agents"
          - label: "trajectory"
            pre: "6 años, una empresa"
            accent: ""
