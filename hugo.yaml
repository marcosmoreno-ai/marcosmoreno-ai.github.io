  # About
  about:
    enable: true
    title: "About Me"
    content: |-
      I'm Marcos. I joined VRAIA in 2020 as the junior who automated the labeling grind; six years later I run the AI team. Same company, very different job — and I never let go of the code on the way up.

      Most of what I know comes from keeping 30+ CNNs and Vision Transformers alive in industrial production. Not the demo: the years after. Drift, dependency hell (cuDNN, ONNX, TensorRT), and deployments stalled for months because two teams stopped talking to each other.

      That last part turned out to be the real job. What kills an AI project is rarely the model; it's the communication. Most of my time now goes into that boundary — technical enough that the team trusts my reviews, close enough to management that blockers actually get removed.

      On my own time I build agents with LangChain and LangGraph, because that's where the next few years point. C1 English from Cambridge; I use it daily.
    skills:
      enable: true
      title: "Technologies I work with:"
      skillGroups:
        - name: "ML & Deep Learning"
          items:
            - "Python"
            - "TensorFlow"
            - "Keras"
