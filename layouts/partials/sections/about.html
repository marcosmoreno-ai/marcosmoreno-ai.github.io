{{ if .Site.Params.about.enable | default false }}
{{- $about := .Site.Language.Params.about | default .Site.Params.about -}}
<section id="about" class="rd-about">
  <div class="rd-wrap rd-reveal">
    <div class="rd-sec-eye" aria-hidden="true"><span class="rd-br">[</span> about <span class="rd-br">]</span></div>
    <h2 class="rd-sec-title">{{ $about.title | default (i18n "about") }}</h2>
    <div class="rd-about-body">{{ $about.content | markdownify }}</div>
  </div>

  <script>
    (function () {
      var els = [].slice.call(document.querySelectorAll('#about .rd-reveal'));
      if (!els.length) return;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) { els.forEach(function (e) { e.classList.add('in'); }); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
      }, { threshold: .15 });
      els.forEach(function (e) { io.observe(e); });
    })();
  </script>
</section>
{{ end }}
